name: Prints do site (manual)
on:
  workflow_dispatch:
    inputs:
      paginas: {description: "rotas separadas por espaço", default: "#/placar #/prefeitura/placar #/v/24"}
permissions:
  contents: write
jobs:
  prints:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: mkdir -p tools/prints && python tools/prints.py ${{ inputs.paginas }}
      - run: |
          git config user.name "radar-robo"; git config user.email "radar-robo@users.noreply.github.com"
          git add -f tools/prints/*.png && git commit -m "Prints para conferência" && git pull --rebase origin main && git push origin HEAD:main || true
