name: Explorar dados (temporário)
on:
  push:
    branches: [explorar-dados]
permissions:
  actions: read
  contents: read
jobs:
  explorar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - run: bash tools/versao_anterior.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - run: mkdir -p site/dados/prefeitura && cp /tmp/anterior/dados/prefeitura/empenhos_*.json site/dados/prefeitura/
      - run: python -u scripts/prefeitura_temas.py
      - run: for f in chuvas emprestimos hospitais; do echo "@@@ $f"; gzip -c site/dados/prefeitura/$f.json | base64 -w0; echo; done
