name: Explorar dados (temporário)
on:
  push:
    branches: [explorar-dados]
permissions:
  actions: read
  contents: read
jobs:
  explorar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - run: python -u tools/explorar.py
