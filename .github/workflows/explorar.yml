name: Explorar fontes (manual)
on: workflow_dispatch
jobs:
  explorar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests openpyxl pypdf
      - run: python tools/explorar.py
