name: Atualizar e publicar o Radar

on:
  schedule:
    # 3 tentativas por dia (o GitHub às vezes atrasa ou pula horários agendados):
    # 3h17, 9h43 e 18h29 em Brasília
    - cron: "17 6 * * *"
    - cron: "43 12 * * *"
    - cron: "29 21 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # sempre a versão mais nova, com o cache de datas da rodada anterior

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install requests beautifulsoup4

      - name: Coletar dados na Câmara (se vier incompleto, para aqui e não publica)
        run: python scripts/coletar.py
        env:
          # rodadas disparadas por mudança no código buscam datas por pouco tempo; as agendadas, por 40 minutos
          RADAR_TEMPO_MAX_DATAS: ${{ github.event_name == 'schedule' && '2400' || '300' }}

      - name: Preparar dados do site
        run: python scripts/processar.py

      - name: Prefeitura, despesas (se falhar, o site mantém a última versão boa)
        id: pref
        continue-on-error: true
        run: python scripts/prefeitura_despesas.py

      - name: Recuperar última versão boa da Prefeitura
        if: steps.pref.outcome == 'failure'
        run: |
          mkdir -p site/dados/prefeitura
          base=https://alemantini.github.io/radar-jf/dados/prefeitura
          curl -fsS "$base/resumo.json" -o site/dados/prefeitura/resumo.json || echo "sem versão anterior"
          for a in 2025 2026; do curl -fsS "$base/empenhos_$a.json" -o "site/dados/prefeitura/empenhos_$a.json" || true; done

      - name: Guardar cache de datas e contagens
        run: |
          git config user.name "radar-robo"
          git config user.email "radar-robo@users.noreply.github.com"
          git add data/cache data/bruto/contagem.json data/bruto/vereadores.json data/bruto/coletado_em.txt
          git add data/bruto/prefeitura_contagem.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nada novo para guardar"
          else
            git commit -m "Dados atualizados $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: coletar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
