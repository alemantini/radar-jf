name: Atualizar e publicar o Radar

on:
  schedule:
    # 3 tentativas por dia (o GitHub às vezes atrasa ou pula horários agendados):
    # 3h17, 9h43 e 18h29 em Brasília
    - cron: "17 6 * * *"
    - cron: "43 12 * * *"
    - cron: "29 21 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # sempre a versão mais nova, com o cache de datas da rodada anterior

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install requests beautifulsoup4 pillow

      - name: Coletar dados na Câmara (se vier incompleto, para aqui e não publica)
        run: python scripts/coletar.py
        env:
          # rodadas disparadas por mudança no código buscam datas por pouco tempo; as agendadas, por 40 minutos
          RADAR_TEMPO_MAX_DATAS: ${{ github.event_name == 'schedule' && '2400' || '300' }}

      - name: Preparar dados do site
        run: python scripts/processar.py

      - name: Baixar a versão publicada anterior (para reaproveitar se alguma coleta falhar)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/versao_anterior.sh

      - name: Prefeitura, despesas (só baixa quando a Prefeitura publica versão nova)
        id: pref
        if: github.event_name != 'push'
        continue-on-error: true
        run: python scripts/prefeitura_despesas.py

      - name: Reaproveitar a última versão publicada da Prefeitura
        if: steps.pref.outcome != 'success' || hashFiles('site/dados/prefeitura/resumo.json') == ''
        run: |
          mkdir -p site/dados/prefeitura
          cp /tmp/anterior/dados/prefeitura/resumo.json /tmp/anterior/dados/prefeitura/empenhos_*.json site/dados/prefeitura/ || echo "sem versão anterior"

      - name: Prefeitura, receitas para o impostômetro (Siconfi, Tesouro Nacional)
        id: receitas
        continue-on-error: true
        run: python scripts/prefeitura_receitas.py

      - name: Reaproveitar receitas publicadas, se a coleta falhar
        if: steps.receitas.outcome != 'success'
        run: |
          mkdir -p site/dados/prefeitura
          cp /tmp/anterior/dados/prefeitura/receitas.json site/dados/prefeitura/ || echo "sem versão anterior"

      - name: Prefeitura, emendas dos vereadores (Monitor de Emendas)
        id: emendas
        continue-on-error: true
        run: python scripts/prefeitura_emendas.py

      - name: Reaproveitar emendas publicadas, se a coleta falhar
        if: steps.emendas.outcome != 'success'
        run: |
          mkdir -p site/dados/prefeitura
          cp /tmp/anterior/dados/prefeitura/emendas_resumo.json /tmp/anterior/dados/prefeitura/emendas.json site/dados/prefeitura/ || echo "sem versão anterior"

      - name: Prefeitura, Diário Oficial (Atos do Governo)
        id: atos
        continue-on-error: true
        run: python scripts/prefeitura_atos.py
        env:
          RADAR_TEMPO_MAX_ATOS: ${{ github.event_name == 'schedule' && '1500' || '600' }}

      - name: Reaproveitar Diário Oficial publicado, se a coleta falhar
        if: steps.atos.outcome != 'success'
        run: |
          mkdir -p site/dados/prefeitura
          cp /tmp/anterior/dados/prefeitura/atos_*.json site/dados/prefeitura/ || echo "sem versão anterior"

      - name: Prefeitura, placar fiscal e comparação com outras cidades (Siconfi)
        id: indices
        continue-on-error: true
        run: python scripts/prefeitura_indices.py

      - name: Reaproveitar placar fiscal publicado, se a coleta falhar
        if: steps.indices.outcome != 'success'
        run: |
          mkdir -p site/dados/prefeitura
          cp /tmp/anterior/dados/prefeitura/indices.json site/dados/prefeitura/ || echo "sem versão anterior"

      - name: Câmara, custo dos gabinetes (folha da Câmara)
        id: gabinetes
        continue-on-error: true
        run: python scripts/camara_gabinetes.py

      - name: Reaproveitar custo dos gabinetes publicado, se a coleta falhar
        if: steps.gabinetes.outcome != 'success'
        run: cp /tmp/anterior/dados/gabinetes.json site/dados/ || echo "sem versão anterior"

      - name: Eleição 2024 (TSE, gerado pelo workflow TSE)
        run: |
          if [ -f data/tse.json ]; then cp data/tse.json site/dados/tse.json; fi
          mkdir -p site/dados/prefeitura
          if [ -f data/prefeitura/comissionados.json ]; then cp data/prefeitura/comissionados.json site/dados/prefeitura/; fi
          if [ -f data/prefeitura/supersalarios.json ]; then cp data/prefeitura/supersalarios.json site/dados/prefeitura/; fi

      - name: Prefeitura, sinais do PNCP (gerados toda semana pelo workflow PNCP)
        run: if [ -f data/prefeitura/pncp_sinais.json ]; then cp data/prefeitura/pncp_sinais.json site/dados/prefeitura/; fi

      - name: Prefeitura, sinais de alerta (cruzamento de dados públicos)
        id: alertas
        continue-on-error: true
        run: python scripts/prefeitura_alertas.py

      - name: Reaproveitar sinais de alerta publicados, se a análise falhar
        if: steps.alertas.outcome != 'success'
        run: cp /tmp/anterior/dados/prefeitura/alertas.json site/dados/prefeitura/ || echo "sem versão anterior"

      - name: Prefeitura, gastos na lupa (veículos, viagens, publicidade, eventos, dezembro)
        continue-on-error: true
        run: python scripts/prefeitura_lupa.py || cp /tmp/anterior/dados/prefeitura/lupa.json site/dados/prefeitura/ || true

      - name: Agenda de audiências públicas da Câmara
        continue-on-error: true
        run: python scripts/camara_agenda.py || (cp /tmp/anterior/dados/agenda.json site/dados/ && cp /tmp/anterior/agenda.ics site/) || true

      - name: Páginas fixas para o Google e imagens de compartilhamento
        continue-on-error: true
        run: python scripts/paginas_estaticas.py

      - name: Guardar cache de datas e contagens
        run: |
          git config user.name "radar-robo"
          git config user.email "radar-robo@users.noreply.github.com"
          git add data/cache data/bruto/contagem.json data/bruto/vereadores.json data/bruto/coletado_em.txt
          git add data/bruto/prefeitura_contagem.json data/bruto/cargos.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nada novo para guardar"
          else
            git commit -m "Dados atualizados $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Marcar a versão dos arquivos (evita visual antigo preso no cache)
        run: sed -i "s/__VERSAO__/${GITHUB_RUN_NUMBER}/g" site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: coletar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
